<!DOCTYPE html>
<html lang="en">

<head>
  <title>Meet</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1e1e1e" />
  <link rel="stylesheet" href="/style.css?v=3" />
  <script src="/js/projects.js?v=3" defer></script>
  <link rel="icon" type="image/png" href="/img/favicon-white.png" />
</head>

<body>
  <header class="bar ceeNoSelect">
    <nav aria-label="Main">
      <a href="/index.html">Home</a>
      <a href="/site/about.html">About</a>
      <a href="????????????">404</a>
      <a href="/site/fun.html">Okayu</a>
      <a href="/site/projects.html" aria-current="page">Projects</a>
      <a href="/site/cevap.html" tabindex="-1" aria-hidden="true"> </a>
    </nav>
    <h1 class="sr-only">Meet</h1>
  </header>

  <main class="page">
    <div class="meet" data-config='{"apiKey":"AIzaSyAsdmjJyxIG7eApqrvkb_AJ4FCIzGhCVxw","authDomain":"cee-meet.firebaseapp.com","projectId":"cee-meet","appId":"1:591583884945:web:713c0894174e21c1d23130"}'>
      <form class="meet-create" data-meet="create" novalidate hidden>
        <h3>New event</h3>
        <label class="meet-field">Title
          <input name="title" maxlength="60" autocomplete="off" placeholder="New event">
        </label>
        <div class="meet-toggle" role="group" aria-label="Survey using">
          <button type="button" data-meet-mode="dates" aria-pressed="true">Specific dates</button>
          <button type="button" data-meet-mode="week" aria-pressed="false">Days of the week</button>
        </div>
        <div class="meet-dates" data-meet="dates">
          <div class="meet-month">
            <button type="button" class="meet-icon" data-meet="prev" aria-label="Previous month">
              <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button type="button" class="meet-month-label" data-meet="month" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5h14v12H3zM3 8.5h14M7 3v4M13 3v4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              <span data-meet="month-name"></span>
            </button>
            <button type="button" class="meet-icon" data-meet="next" aria-label="Next month">
              <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <div class="meet-months" data-meet="months" role="group" aria-label="Pick a month" hidden></div>
          </div>
          <div class="meet-cal" data-meet="cal" role="group" aria-label="Dates"></div>
        </div>
        <div class="meet-week" data-meet="week" role="group" aria-label="Days of the week" hidden></div>
        <p class="meet-hint">Click or drag to choose up to 31 days.</p>
        <div class="meet-times">
          <div class="meet-times-head">
            <span>Time range</span>
            <div class="meet-toggle meet-clock" role="group" aria-label="Time format">
              <button type="button" data-meet-clock="24" aria-pressed="true">24h</button>
              <button type="button" data-meet-clock="12" aria-pressed="false">12h</button>
            </div>
          </div>
          <div class="meet-row">
            <div class="meet-field">
              <span id="MeetFromLabel">No earlier than</span>
              <div class="meet-select" data-meet-select="from" data-label="MeetFromLabel"></div>
            </div>
            <div class="meet-field">
              <span id="MeetToLabel">No later than</span>
              <div class="meet-select" data-meet-select="to" data-label="MeetToLabel"></div>
            </div>
          </div>
          <div class="meet-inline">
            <span id="MeetTzLabel">Time zone</span>
            <div class="meet-select meet-zone" data-meet-select="tz" data-label="MeetTzLabel"></div>
          </div>
        </div>
        <button type="submit" class="cee-button">Create event</button>
      </form>
      <section class="meet-event" data-meet="event" hidden>
        <div class="meet-head">
          <label class="meet-title-field">
            <span>Event name, click to rename</span>
            <input class="meet-title" data-meet="title" maxlength="60" autocomplete="off">
          </label>
          <span class="meet-copied" aria-hidden="true">Link copied</span>
          <button type="button" class="meet-icon meet-copy" data-meet="copy" aria-label="Copy event link">
            <svg class="meet-copy-icon" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M7 7h10v10H7zM13 7V3H3v10h4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <svg class="meet-check-icon" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M4 10.5 8 14.5 16 5.5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
          </button>
        </div>
        <input type="file" accept="image/*" data-meet="file" hidden>
        <form class="meet-join" data-meet="join" novalidate>
          <button type="button" class="meet-pic" data-meet-pic aria-label="Upload profile picture">+</button>
          <label class="meet-field">Nickname
            <input name="name" maxlength="20" autocomplete="off" placeholder="Your nickname">
          </label>
          <button type="submit" class="meet-go">Join to mark hours</button>
        </form>
        <div class="meet-who" data-meet="who" hidden>
          <button type="button" class="meet-pic" data-meet-pic aria-label="Change profile picture">+</button>
          <span data-meet="me"></span>
          <button type="button" class="meet-small" data-meet="change">Change</button>
        </div>
        <div class="meet-names" data-meet="names" data-mode="all">
          <p class="meet-names-head" data-meet="names-head"></p>
          <div class="meet-names-cols">
            <div>
              <h5 data-meet="yes-title">Joined</h5>
              <ul data-meet="yes"></ul>
            </div>
            <div class="meet-names-no">
              <h5>Unavailable</h5>
              <ul data-meet="no"></ul>
            </div>
          </div>
        </div>
        <div class="meet-view">
          <div class="meet-inline">
            <span id="MeetViewLabel">Times in</span>
            <div class="meet-select meet-zone" data-meet-select="view" data-label="MeetViewLabel"></div>
          </div>
          <div class="meet-toggle meet-clock" role="group" aria-label="Time format" title="Time format">
            <button type="button" data-meet-clock="24" aria-pressed="true">24h</button>
            <button type="button" data-meet-clock="12" aria-pressed="false">12h</button>
          </div>
          <button type="button" class="meet-icon meet-eye" data-meet="pics" aria-pressed="false" aria-label="Show pictures in the grid" title="Show pictures in the grid">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="9" cy="7.5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 19c0-3.5 2.7-6 6-6 .9 0 1.7.2 2.5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12.5 17c1.4-2 3-3 4.75-3S20.6 15 22 17c-1.4 2-3 3-4.75 3s-3.35-1-4.75-3z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17.25" cy="17" r="1.2" fill="currentColor"/><path class="meet-eye-slash" d="M2.5 2.5 21.5 21.5" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
        <div class="meet-grids" data-meet="grids">
          <div class="meet-col">
            <div class="meet-col-head"><h4>Your hours</h4></div>
            <div class="meet-stage">
              <div class="meet-scroll">
                <div class="meet-grid meet-mine" data-meet="mine" role="group" aria-label="Your free hours"></div>
              </div>
              <button type="button" class="meet-gate" data-meet="gate">Join with a nickname first</button>
            </div>
          </div>
          <div class="meet-col">
            <div class="meet-col-head">
              <h4>Group</h4>
              <div class="meet-legend" aria-hidden="true">
                <span data-meet="legend-min">0/0</span>
                <span class="meet-legend-steps"><i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i><i data-level="4" data-all="true"></i></span>
                <span data-meet="legend-max">0/0 free</span>
              </div>
            </div>
            <div class="meet-stage">
              <div class="meet-scroll">
                <div class="meet-grid meet-group" data-meet="group" role="group" aria-label="Group free hours"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <p class="meet-status" data-meet="status" role="status"></p></div>
  </main>
</body>

</html>
